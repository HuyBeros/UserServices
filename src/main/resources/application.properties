spring.application.name=user-services
server.port=8081

# Tự động đọc biến môi trường từ file .env (optional = không crash nếu file chưa tồn tại)
spring.config.import=optional:file:.env[.properties]

# Database PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:QLBookStore}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security Configuration
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}
application.security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Swagger / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:4200

# Rate Limiting Configuration
rate.limit.login.capacity=5
rate.limit.login.refill-tokens=5
rate.limit.login.refill-duration-minutes=15

# Admin Configuration
admin.default.username=${ADMIN_USERNAME:admin}
admin.default.password=${ADMIN_PASSWORD}
admin.default.email=${ADMIN_EMAIL:admin@bookstore.com}

